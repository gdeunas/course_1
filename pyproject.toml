[project]
name = "course-1"
version = "0.1.0"
description = ""
authors = [
    {name = "aidar",email = "anged@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "setuptools (>=80.9.0,<81.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.0,<2.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.isort]
profile = "black"
line_length = 119
skip = [".gitignore", ".venv", "venv"]
skip_glob = ".venv/*"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
exclude = ["^\\venv/", "^venv/", "\\.git/", ".venv"]

[tool.black]
line-length = 119
extend-exclude = '''
( \.git | \\.venv | __pycache__ | migrations )
'''